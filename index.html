<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101914">
<title>Pizza Tycoon</title>
<style>
:root{--ink:#fff8e9;--muted:#e4d7bd;--panel:#26364a;--panel2:#354b63;--lime:#ffd45e;--gold:#ffcf57}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101914;color:var(--ink);font-family:system-ui,-apple-system,sans-serif;touch-action:none}button,input{font:inherit}button{border:0;border-radius:14px;padding:13px 16px;font-weight:800;color:#172016;background:var(--lime);cursor:pointer}button.secondary{background:#34463b;color:var(--ink);border:1px solid #526557}button:disabled{opacity:.4}
#game{position:fixed;inset:0;background:linear-gradient(#78c8e8,#d8f0df)}canvas{width:100%;height:100%;display:block;touch-action:none}
#top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;background:linear-gradient(#101914c9,transparent)}
.brand{font-weight:1000;letter-spacing:1.4px;text-shadow:0 2px 5px #0008}.brand span{color:var(--lime)}.money{background:#17241ddd;border:1px solid #ffffff30;border-radius:99px;padding:8px 12px;color:var(--gold);font-weight:900}
#hint{position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);background:#17241ddd;padding:7px 12px;border-radius:99px;font-size:12px;color:#e6eee4;white-space:nowrap;pointer-events:none}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:9px 8px calc(env(safe-area-inset-bottom) + 8px);display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:linear-gradient(transparent,#101914 24%)}
.nav{background:#1b2a22ed;color:#dce6d8;border:1px solid #ffffff20;padding:9px 3px;font-size:11px;border-radius:13px}.nav b{display:block;font-size:20px;margin-bottom:2px}.nav.active{background:#344b36;color:var(--lime);border-color:#a8d86a}
#panel{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 78px);max-height:42vh;overflow:auto;background:#2c4560f2;border:2px solid #fff1d1;border-radius:20px;padding:15px;box-shadow:0 14px 45px #0008;display:none;backdrop-filter:blur(12px)}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.panelhead h2{font-size:18px;margin:0}.close{background:#34463b;color:white;padding:7px 11px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.statrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff17;font-size:14px}
.overlay{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:22px;background:linear-gradient(145deg,#203b59f5,#527a91f2)}.overlay.show{display:flex}.modal{width:min(440px,100%);background:#2d4560;border:2px solid #fff1d1;border-radius:25px;padding:24px;box-shadow:0 25px 80px #0009}.logo{font-size:56px;text-align:center;filter:drop-shadow(0 8px 12px #0008)}h1{font-size:30px;line-height:1.05;text-align:center;margin:8px 0}.sub{text-align:center;color:#bdc9bc;margin:0 0 22px}.menuBtns{display:grid;gap:10px}.field{display:block;margin:12px 0;color:#d9e3d6;font-size:13px}.field input{width:100%;padding:13px;border:1px solid #526557;border-radius:12px;background:#101914;color:white;margin-top:6px}.menuBtns button{width:100%}.tiny{text-align:center;font-size:11px;color:#93a295;margin-top:17px}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 94px);transform:translateX(-50%);background:#17251f;color:white;border:1px solid #ffffff30;border-radius:12px;padding:10px 14px;display:none;white-space:nowrap;z-index:4}
</style>
</head>
<body>
<div id="game"><canvas id="world"></canvas>
<div id="top"><div class="brand">🍕 PIZZA <span>TYCOON</span></div><div class="money" id="money">5.000 €</div></div>
<div id="hint">Stadt erkunden · Grundstück antippen</div>
<div id="toast"></div>
<div id="panel"></div>
<div id="bottom">
<button class="nav active" data-tab="city"><b>🏙️</b>Stadt</button>
<button class="nav" data-tab="business"><b>🍕</b>Pizzeria</button>
<button class="nav" data-tab="map"><b>🗺️</b>Karte</button>
<button class="nav" data-tab="menu"><b>☰</b>Menü</button>
</div></div>
<div class="overlay show" id="intro"><div class="modal"><div class="logo">🍕</div><h1>PIZZA TYCOON</h1><p class="sub">Deine Stadt. Dein Geschäft. Deine Regeln.</p><div class="menuBtns"><button id="introGo">Spiel betreten</button></div><div class="tiny">Eine Stadt wartet auf dich.</div></div></div>
<div class="overlay" id="mainMenu"><div class="modal"><div class="logo">🍕</div><h1>PIZZA TYCOON</h1><p class="sub">Baue dein Pizza-Imperium.</p><div class="menuBtns"><button id="newGame">Neues Spiel</button><button class="secondary" id="loadGame">Spiel laden</button><button class="secondary" id="settings">Einstellungen</button></div><div class="tiny">Mobile Edition · Entwicklungs-Version</div></div></div>
<div class="overlay" id="setup"><div class="modal"><div class="logo">🏪</div><h1>Dein Unternehmen</h1><p class="sub">Wie soll deine erste Pizzeria heißen?</p><label class="field">Firmenname<input id="company" maxlength="24" placeholder="z. B. Tonys Pizza"></label><label class="field">Startkapital<select id="capital" class="field" style="width:100%;padding:12px;background:#101914;color:white;border:1px solid #526557;border-radius:12px"><option value="5000">Normal · 5.000 €</option><option value="3000">Schwer · 3.000 €</option><option value="8000">Entspannt · 8.000 €</option></select></label><div class="menuBtns"><button id="createCompany">Stadt betreten</button><button class="secondary" id="cancelSetup">Zurück</button></div></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
const SAVE='pizzaTycoonWorld_v2';
let W=0,H=0,dpr=1,cam={x:5.2,y:5.2,zoom:1},drag=null,pinch=null,selected=null,activeTab='city',last=0,toastTimer=0;
const state={company:'',money:5000,day:1,owned:null,shop:null,customers:0,revenue:0,started:false};
const N=61,T=52,tiles=[];
const buildings=[
 {name:'Stadthaus',emoji:'🏠',color:'#d18b65',kind:'home'},
 {name:'Altbau',emoji:'🏘️',color:'#c77b62',kind:'oldhome'},
 {name:'Wohnblock',emoji:'🏢',color:'#c6a47c',kind:'apartments'},
 {name:'Büroturm',emoji:'🏙️',color:'#83a8b7',kind:'office'},
 {name:'Schule',emoji:'🏫',color:'#dfbd75',kind:'school'},
 {name:'Supermarkt',emoji:'🏬',color:'#a7b77c',kind:'market'},
 {name:'Park',emoji:'🌳',color:'#4e895c',kind:'park'},
 {name:'Ladenlokal',emoji:'🏪',color:'#bd819a',kind:'shop'},
 {name:'Café',emoji:'☕',color:'#d69b62',kind:'cafe'},
 {name:'Werkhalle',emoji:'🏭',color:'#8d9997',kind:'factory'},
 {name:'Rathaus',emoji:'🏛️',color:'#d6c39b',kind:'landmark'}
];
function makeCity(){
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const road=(x%3===0||y%3===0),edge=x===0||y===0||x===N-1||y===N-1,plot=!road&&!edge;
  const roll=(x*37+y*71+x*y*13)%100;
  let kind=0;
  // Deutlich erkennbare Stadtviertel: Wohnen ist nur ein Teil der Stadt.
  if(x>=39&&y>=39) kind=roll<42?9:roll<58?5:roll<72?3:roll<84?7:roll<94?8:6; // Gewerbepark
  else if(x>=22&&x<=39&&y>=20&&y<=40) kind=roll<15?3:roll<25?2:roll<48?8:roll<68?7:roll<82?5:roll<89?4:6; // Innenstadt mit weniger hohen Häusern
  else if(x<22&&y<24) kind=roll<30?1:roll<53?8:roll<73?7:roll<85?5:roll<94?0:6; // Altstadt mit Läden
  else if(y>42&&x>18&&x<43) kind=roll<30?5:roll<54?7:roll<75?8:roll<86?3:roll<94?6:0; // Einkaufsviertel
  else if(x>=39&&y<25) kind=roll<12?4:roll<30?3:roll<44?5:roll<64?8:roll<84?6:7; // öffentlicher / Bürobereich
  else kind=roll<27?0:roll<43?1:roll<51?2:roll<65?6:roll<78?7:roll<91?8:roll<96?4:5; // gemischte Wohnviertel
  // Öffentliche Plätze und Parkflächen lockern das starre Straßenraster auf
  let space=null;
  if(plot&&x>=24&&x<=26&&y>=27&&y<=29) space='plaza';
  else if(plot&&x>=33&&x<=35&&y>=15&&y<=17) space='garden';
  else if(plot&&x>=42&&x<=44&&y>=33&&y<=35) space='parking';
  else if(plot&&x>=12&&x<=14&&y>=39&&y<=41) space='garden';
  else if(plot&&x>=45&&x<=47&&y>=12&&y<=14) space='parking';
  const empty=plot&&(roll>92||!!space);
  const ground=space==='garden'||kind===6?'#8eaa78':space==='plaza'||kind===7||kind===8||kind===5?'#b9ad91':kind===9?'#a9a99a':(roll%4===0?'#b4ad91':roll%4===1?'#a9ad91':roll%4===2?'#b5b09a':'#a8a98d');
  tiles.push({x,y,road,plot,space,ground,building:plot&&!empty?buildings[kind]:null,price:900+((x*73+y*91)%8)*180,traffic:35+((x*19+y*13)%60),rent:120+((x*31+y*17)%100),id:y*N+x});
 }
 // Ein markantes Rathaus als Orientierungspunkt im Zentrum
 const landmark=tiles.find(t=>t.x===30&&t.y===27);
 if(landmark)landmark.building={name:'Rathaus',emoji:'🏛️',color:'#d6c39b',kind:'landmark'};
}
makeCity();
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!cam.ready){cam.x=N/2;cam.y=N/2;cam.zoom=1.12;cam.ready=true;}clampCamera();draw();}
addEventListener('resize',resize);
function iso(x,y){return{x:(x-y)*T*.72,y:(x+y)*T*.36};}
function screen(x,y){let p=iso(x-cam.x,y-cam.y);return{x:W/2+p.x*cam.zoom,y:H*.46+p.y*cam.zoom};}
function clampCamera(){const edge=3.4;cam.x=Math.max(edge,Math.min(N-edge,cam.x));cam.y=Math.max(edge,Math.min(N-edge,cam.y));}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1.2,2.1*cam.zoom);ctx.lineJoin='round';ctx.stroke();}}
function diamond(x,y,color){let p=screen(x,y),w=T*.72*cam.zoom,h=T*.36*cam.zoom;poly([{x:p.x,y:p.y-h},{x:p.x+w,y:p.y},{x:p.x,y:p.y+h},{x:p.x-w,y:p.y}],color,'#344c3e55');}
function rounded(x,y,w,h,r,fill,stroke){
ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1,1.5*cam.zoom);ctx.stroke();}
}
function drawTree(x,y,z=1){
ctx.save();ctx.translate(x,y);ctx.scale(z,z);
ctx.fillStyle='#344b3455';ctx.beginPath();ctx.ellipse(0,5,18,8,0,0,Math.PI*2);ctx.fill();
rounded(-4,-23,8,27,3,'#805333','#553d2d');
ctx.fillStyle='#2f7548';ctx.beginPath();ctx.arc(-8,-27,13,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#4d9b58';ctx.beginPath();ctx.arc(7,-31,15,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#79bd67';ctx.beginPath();ctx.arc(-2,-41,11,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#285d3d';ctx.lineWidth=2;ctx.stroke();ctx.restore();
}
function drawBuilding(tile,time){
let p=screen(tile.x,tile.y),z=cam.zoom,b=tile.building;if(!b)return;
if(tile===state.owned)b={name:state.company,emoji:'🍕',color:'#ed8a42',kind:'pizza'};
const seed=tile.id*9301+17,rand=n=>{let v=Math.sin(seed+n*127.1)*43758.5453;return v-Math.floor(v);};
if(b.kind==='park'){
  // kleine Stadtparks statt leerer grüner Felder
  const s=.72+rand(1)*.45;drawTree(p.x-10*z,p.y-7*z,s*z);drawTree(p.x+16*z,p.y+1*z,.72*z);
  ctx.strokeStyle='#e8d5a2';ctx.lineWidth=5*z;ctx.beginPath();ctx.moveTo(p.x-25*z,p.y+5*z);ctx.lineTo(p.x+25*z,p.y-5*z);ctx.stroke();
  ctx.fillStyle='#e7d8a8';ctx.beginPath();ctx.arc(p.x-3*z,p.y-5*z,3*z,0,Math.PI*2);ctx.fill();return;
}
const kind=b.kind,wallColor=shade(b.color,Math.floor(rand(90)*25)-12);
let floors=kind==='office'?2+Math.floor(rand(2)*3):kind==='apartments'?2+Math.floor(rand(2)*2):kind==='landmark'?3:kind==='factory'?1:kind==='school'?2:kind==='market'?1+Math.floor(rand(2)):kind==='pizza'?2:1+Math.floor(rand(3));
let h=(kind==='office'?floors*14:kind==='apartments'?floors*11:kind==='landmark'?84:kind==='factory'?31:kind==='school'?48:kind==='market'?42:kind==='pizza'?50:kind==='cafe'?35:kind==='oldhome'?38+floors*6:29+floors*6)*z;
let w=(kind==='office'?22+rand(3)*11:kind==='factory'?31+rand(3)*8:kind==='school'||kind==='landmark'?30+rand(3)*8:kind==='oldhome'?22+rand(3)*13:kind==='home'?21+rand(3)*15:25+rand(3)*12)*z;
let d=(kind==='office'?17+rand(4)*10:kind==='factory'?27+rand(4)*8:kind==='oldhome'?17+rand(4)*13:14+rand(4)*14)*z;
let base=p.y-4*z,ink='#59463e',left=shade(wallColor,-34),right=shade(wallColor,-12),roof=shade(wallColor,24);
ctx.fillStyle='#263d3655';ctx.beginPath();ctx.ellipse(p.x,base+8*z,w*1.05, d*.58,0,0,Math.PI*2);ctx.fill();
const leftGrad=ctx.createLinearGradient(p.x-w,base-h,p.x,base);leftGrad.addColorStop(0,shade(wallColor,7));leftGrad.addColorStop(1,left);
const rightGrad=ctx.createLinearGradient(p.x,base-h,p.x+w,base);rightGrad.addColorStop(0,shade(wallColor,18));rightGrad.addColorStop(1,right);
poly([{x:p.x-w,y:base},{x:p.x,y:base+d*.52},{x:p.x,y:base-h+d*.52},{x:p.x-w,y:base-h}],leftGrad,ink);
poly([{x:p.x,y:base+d*.52},{x:p.x+w,y:base},{x:p.x+w,y:base-h},{x:p.x,y:base-h+d*.52}],rightGrad,ink);
// Unterschiedliche Dächer: Satteldach, Flachdach, Mansarde und Hallendach
const roofType=kind==='office'||kind==='apartments'?'flat':kind==='factory'?'shed':kind==='oldhome'?'gable':kind==='school'||kind==='landmark'?'gable':kind==='home'?(rand(5)<.72?'gable':rand(6)<.5?'flat':'hip'):(rand(5)<.38?'gable':rand(7)<.5?'flat':'hip');
if(roofType==='gable'||roofType==='shed'){
  let ridge=kind==='factory'?d*.72:d*.62;
  poly([{x:p.x-w-3*z,y:base-h},{x:p.x,y:base-h-ridge*z},{x:p.x+w+3*z,y:base-h},{x:p.x,y:base-h+d*.52}],kind==='school'?'#b95143':shade(wallColor,31),ink);
  ctx.strokeStyle=shade(wallColor,-25);ctx.lineWidth=2*z;ctx.beginPath();ctx.moveTo(p.x,base-h-ridge*z);ctx.lineTo(p.x,base-h-ridge*z+5*z);ctx.stroke();
  // Feine Dachziegel-Linien auf den sichtbaren Dachflächen
  ctx.save();ctx.strokeStyle=shade(wallColor,-16);ctx.lineWidth=.8*z;ctx.globalAlpha=.58;
  for(let row=1;row<=3;row++){let yy=base-h-ridge*z+row*ridge*z*.22;ctx.beginPath();ctx.moveTo(p.x-w+row*2*z,yy+row*ridge*z*.22);ctx.lineTo(p.x+row*2*z,yy+row*ridge*z*.22);ctx.stroke();}
  ctx.restore();
}else if(roofType==='hip'){
  poly([{x:p.x-w-3*z,y:base-h+3*z},{x:p.x,y:base-h-d*.42},{x:p.x+w+3*z,y:base-h+3*z},{x:p.x,y:base-h+d*.52}],roof,ink);
  poly([{x:p.x-w-3*z,y:base-h+3*z},{x:p.x,y:base-h+3*z+d*.18},{x:p.x,y:base-h+d*.52},{x:p.x-w,y:base-h+d*.52}],shade(roof,-13),ink);
  ctx.strokeStyle=shade(roof,-25);ctx.lineWidth=1.4*z;ctx.beginPath();ctx.moveTo(p.x-w,base-h+3*z);ctx.lineTo(p.x,base-h-d*.42);ctx.lineTo(p.x+w,base-h+3*z);ctx.stroke();
}else{
  poly([{x:p.x-w-3*z,y:base-h},{x:p.x,y:base-h-d*.55},{x:p.x+w+3*z,y:base-h},{x:p.x,y:base-h+d*.52}],roof,ink);
  // Dachkante, Lüfter und kleine Aufbauten
  ctx.strokeStyle='#f1dfbd';ctx.lineWidth=2*z;ctx.beginPath();ctx.moveTo(p.x-w,base-h);ctx.lineTo(p.x,base-h+d*.52);ctx.lineTo(p.x+w,base-h);ctx.stroke();
  if(kind==='office'||kind==='apartments'){
    rounded(p.x-8*z,base-h-d*.12,13*z,8*z,1*z,'#687e83','#40565a');
    rounded(p.x+13*z,base-h-d*.05,7*z,6*z,1*z,'#9da8a0','#53635f');
  }
}
// Individuelle Dachaufbauten je Gebäudetyp – kleine Silhouetten statt identischer Dächer.
if(kind==='home'&&rand(150)>.48){
  // Solarpaneele auf einem Teil der Einfamilienhäuser.
  const sx=p.x-w*.42,sy=base-h-d*.12;
  poly([{x:sx,y:sy},{x:sx+12*z,y:sy-4*z},{x:sx+22*z,y:sy+1*z},{x:sx+10*z,y:sy+5*z}],'#42677a','#304c58');
  ctx.strokeStyle='#a9d2d9';ctx.lineWidth=.8*z;
  ctx.beginPath();ctx.moveTo(sx+6*z,sy-2*z);ctx.lineTo(sx+16*z,sy+3*z);ctx.moveTo(sx+12*z,sy-3*z);ctx.lineTo(sx+8*z,sy+4*z);ctx.stroke();
}
if(kind==='factory'){
  // Fabrikhallen bekommen Oberlichter und einen markanten Schornstein.
  rounded(p.x+w*.48,base-h-17*z,7*z,19*z,1*z,'#a66b50','#62483e');
  rounded(p.x+w*.43,base-h-19*z,17*z,3*z,1*z,'#754b40','#493b35');
  ctx.fillStyle='#d9d4c5';ctx.globalAlpha=.35;ctx.beginPath();ctx.ellipse(p.x+w*.52,base-h-25*z,5*z,3*z,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  for(let skylight=0;skylight<3;skylight++){
    const xx=p.x-w*.48+skylight*10*z;
    poly([{x:xx,y:base-h-5*z},{x:xx+5*z,y:base-h-9*z},{x:xx+10*z,y:base-h-5*z},{x:xx+5*z,y:base-h-1*z}],'#9bcbd2','#52666a');
  }
}
if(kind==='market'){
  // Marktgebäude: sichtbare Lüftungsanlage auf dem Flachdach.
  rounded(p.x-5*z,base-h-d*.1,13*z,7*z,1*z,'#a8aaa0','#60665f');
  ctx.strokeStyle='#626c68';ctx.lineWidth=1*z;
  for(let vent=0;vent<3;vent++){ctx.beginPath();ctx.moveTo(p.x-3*z,base-h-d*.1+2*z+vent*1.5*z);ctx.lineTo(p.x+6*z,base-h-d*.1+2*z+vent*1.5*z);ctx.stroke();}
}
if(kind==='school'){
  // Schulgebäude mit kleinem Uhrengiebel.
  ctx.fillStyle='#f1dfb9';ctx.beginPath();ctx.arc(p.x,base-h-8*z,4*z,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#655748';ctx.lineWidth=1*z;ctx.beginPath();ctx.moveTo(p.x,base-h-11*z);ctx.lineTo(p.x,base-h-8*z);ctx.lineTo(p.x+2*z,base-h-7*z);ctx.stroke();
}
// Fensterreihen und Balkone geben jedem Haus eine eigene Fassade
// Kleine Schornsteine und Dachdetails machen Wohnhäuser unverwechselbarer.
if((kind==='home'||kind==='oldhome')&&rand(44)>.42){
 const cx=p.x+(rand(45)-.5)*w*.9,cy=base-h-d*.23;
 rounded(cx-2.5*z,cy-12*z,5*z,12*z,1*z,'#9b6652','#654b40');
 rounded(cx-3.5*z,cy-13*z,7*z,2*z,1*z,'#765044');
}
const rows=Math.max(1,Math.min(6,Math.floor(h/(13*z)))),cols=kind==='office'?2:2;
for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){
  let wy=base-h+(12+r*Math.min(15,(h/z)/(rows+1)))*z;
  let wx=col===0?p.x-w*.68:p.x+w*.17;
  const ww=(kind==='office'?7:8)*z,wh=(kind==='office'?9:10)*z;
  let glass=ctx.createLinearGradient(wx,wy,wx+ww,wy+wh);glass.addColorStop(0,'#fff0c2');glass.addColorStop(1,kind==='office'?'#75b8d0':'#8ccbd4');
  rounded(wx,wy,ww,wh,1.4*z,glass,ink);
  // Fensterrahmen, Mittelsteg und zufällige Fensterläden

function drawCityLife(time){
const colors=['#e45c4f','#f0c44f','#4f8ecb','#f4f0df','#4f9b71','#d87c42'];
// Autos fahren auf zusammenhängenden Straßenringen und drehen an jeder Ecke mit.
const rings=[3,15,27];
rings.forEach((low,ri)=>{
 const high=57-low,route=[{x:low,y:low},{x:high,y:low},{x:high,y:high},{x:low,y:high},{x:low,y:low}];
 const lengths=route.slice(0,-1).map((p,i)=>Math.abs(route[i+1].x-p.x)+Math.abs(route[i+1].y-p.y));
 const total=lengths.reduce((a,b)=>a+b,0);
 for(let n=0;n<4;n++){
  let distance=(time*.00155*(.82+((n+ri)%3)*.18)+n*total/4+ri*total/11)%total;
  let seg=0;while(seg<3&&distance>lengths[seg]){distance-=lengths[seg];seg++;}
  const a=route[seg],b=route[seg+1],len=lengths[seg],t=distance/len;
  const x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;
  const dx=b.x-a.x,dy=b.y-a.y,angle=Math.atan2(dy*.36,dx*.72);
  drawCar(x,y,time,colors[(n+ri*2)%colors.length],angle);
 }
});
// Fußgänger bleiben auf den Bürgersteigen direkt neben den Fahrbahnen.
for(let i=0;i<84;i++){
 const lane=3+(i%19)*3,dir=i%2,side=(Math.floor(i/2)%2===0?-8:8),along=1+((time*.00038*(i%3===0?1.12:.82)+i*7.31)%(N-2));
 if(dir===0){const reverse=i%4===1,angle=Math.atan2(reverse?-.36:.36,reverse?-.72:.72);drawPedestrian(reverse?N-along:along,lane,time,colors[i%colors.length],angle,side);}
 else{const reverse=i%4===3,angle=Math.atan2(reverse?-.36:.36,reverse?.72:-.72);drawPedestrian(lane,reverse?N-along:along,time,colors[i%colors.length],angle,side);}
}
}

function drawSidewalk(t,p){

  const pts=points.map(([x,y])=>screen(t.x+x,t.y+y));
  poly(pts,'#c9c3b2','#827f73');
  // Fugen quer über den Gehweg: dadurch wirken die Flächen wie verlegte Platten.

   ctx.stroke();
  }

  for(let i=0;i<3;i++){
   const f=((seed+i*2)%7+1)/9;
   const x=pts[0].x+(pts[1].x-pts[0].x)*f;
   const y=pts[0].y+(pts[1].y-pts[0].y)*f;

   ctx.beginPath();ctx.arc(x,y,Math.max(.45,.7*z),0,Math.PI*2);ctx.fill();

  ctx.strokeStyle='#f0e8d5';ctx.lineWidth=Math.max(1,2*z);
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(pts[3].x,pts[3].y);ctx.stroke();
  ctx.strokeStyle='#8e897d';ctx.lineWidth=Math.max(.6,.9*z);
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y+1*z);ctx.lineTo(pts[3].x,pts[3].y+1*z);ctx.stroke();
 };
 if(t.x%3===0){
  for(const side of [-1,1])strip([[side*.46,-.49],[side*.73,-.49],[side*.73,.49],[side*.46,.49]],t.x+t.y+side);
 }else{
  for(const side of [-1,1])strip([[-.49,side*.46],[-.49,side*.73],[.49,side*.73],[.49,side*.46]],t.x+t.y+side);
 }
}
function drawStreetProps(t,p){const z=cam.zoom;
// Straßenlaternen an ausgewählten Gehweg-Ecken
if(t.road&&(t.x*5+t.y*3)%8===0){const lx=p.x+19*z,ly=p.y-10*z;ctx.strokeStyle='#42504a';ctx.lineWidth=3*z;ctx.beginPath();ctx.moveTo(lx,ly+12*z);ctx.lineTo(lx,ly-22*z);ctx.lineTo(lx+8*z,ly-26*z);ctx.stroke();ctx.fillStyle='#ffe9a0';ctx.beginPath();ctx.arc(lx+8*z,ly-26*z,4*z,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff3bd';ctx.lineWidth=1*z;ctx.stroke();}
// Kleine Bushaltestellen mit Dach und Haltestellenschild
if(t.x===3&&t.y===4||t.x===6&&t.y===7){rounded(p.x-17*z,p.y-17*z,28*z,3*z,1*z,'#e7e9df','#52605a');ctx.strokeStyle='#52605a';ctx.lineWidth=2*z;ctx.beginPath();ctx.moveTo(p.x-14*z,p.y-14*z);ctx.lineTo(p.x-14*z,p.y+5*z);ctx.moveTo(p.x+8*z,p.y-14*z);ctx.lineTo(p.x+8*z,p.y+5*z);ctx.stroke();rounded(p.x+13*z,p.y-21*z,3*z,23*z,1*z,'#52605a');rounded(p.x+10*z,p.y-24*z,9*z,8*z,2*z,'#f4d46d','#52605a');ctx.fillStyle='#33443c';ctx.font='bold '+(5*z)+'px system-ui';ctx.textAlign='center';ctx.fillText('BUS',p.x+14.5*z,p.y-18*z);}
// Geparkte Autos am Straßenrand
if(t.road&&t.y%3===0&&t.x%3===1&&t.x<9){drawCar(t.x+.12,t.y+.42,0,t.x%2?'#d95c4d':'#4c86b8');}
}
function drawMapBase(time){ctx.fillStyle='#4babc5';ctx.fillRect(0,0,W,H);for(let i=0;i<22;i++){let x=(i*137+time*.009)%(W+100)-50,y=(i*83+Math.sin(time*.001+i)*8)%(H+30);ctx.strokeStyle='#b8e8e766';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+24,y-3);ctx.stroke();}const corners=[[3,3],[N-3,3],[N-3,N-3],[3,N-3]].map(([x,y])=>screen(x,y));poly(corners,'#c9b47b','#8caa72');const inner=[[3.5,3.5],[N-3.5,3.5],[N-3.5,N-3.5],[3.5,N-3.5]].map(([x,y])=>screen(x,y));poly(inner,'#83bd69','#e6d29a');}
function draw(time=0){if(!W)return;ctx.clearRect(0,0,W,H);drawMapBase(time);
const ordered=[...tiles].sort((a,b)=>a.x+a.y-(b.x+b.y));
for(const t of ordered){let p=screen(t.x,t.y);if(p.x<-100||p.x>W+100||p.y<-130||p.y>H+100)continue;
let road=t.road,coastal=t.x<3||t.y<3||t.x>=N-3||t.y>=N-3;if(coastal&&!road)continue;diamond(t.x,t.y,coastal?'#9a7954':(road?'#747b80':(t.plot?t.ground:'#879b78')));if(road&&!coastal)drawSidewalk(t,p);if(coastal&&road){const z=cam.zoom;ctx.strokeStyle='#e2c18a';ctx.lineWidth=2*z;for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(p.x-17*z,p.y+k*7*z);ctx.lineTo(p.x+17*z,p.y+k*7*z);ctx.stroke();}ctx.strokeStyle='#5b5144';ctx.lineWidth=2*z;ctx.beginPath();ctx.moveTo(p.x-18*z,p.y-11*z);ctx.lineTo(p.x+18*z,p.y+11*z);ctx.moveTo(p.x-18*z,p.y+11*z);ctx.lineTo(p.x+18*z,p.y-11*z);ctx.stroke();}
if(road){
const z=cam.zoom;
if(t.x%3===0&&t.y%3!==0){
ctx.strokeStyle='#f7e8b866';ctx.lineWidth=2*z;ctx.setLineDash([7*z,7*z]);ctx.beginPath();ctx.moveTo(p.x-4*z,p.y-18*z);ctx.lineTo(p.x-4*z,p.y+18*z);ctx.stroke();ctx.setLineDash([]);
}
if(t.y%3===0&&t.x%3!==0){
ctx.strokeStyle='#f7e8b866';ctx.lineWidth=2*z;ctx.setLineDash([7*z,7*z]);ctx.beginPath();ctx.moveTo(p.x+4*z,p.y-18*z);ctx.lineTo(p.x+4*z,p.y+18*z);ctx.stroke();ctx.setLineDash([]);
}
if(t.x%3===0&&t.y%3===0){
ctx.strokeStyle='#fff4d8';ctx.lineWidth=2*z;
for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(p.x-15*z+k*5*z,p.y-8*z);ctx.lineTo(p.x-15*z+k*5*z,p.y+8*z);ctx.stroke();}
ctx.fillStyle='#f5e7c6';ctx.beginPath();ctx.arc(p.x,p.y,2.5*z,0,Math.PI*2);ctx.fill();
  // Ampeln an ausgewählten Kreuzungen
  if((t.x+t.y)%6===0){rounded(p.x+15*z,p.y-24*z,5*z,16*z,2*z,'#48534d','#28332e');for(let q=0;q<3;q++){ctx.fillStyle=['#e65b4f','#e9c95c','#72c66f'][q];ctx.beginPath();ctx.arc(p.x+17.5*z,p.y-21*z+q*5*z,1.3*z,0,Math.PI*2);ctx.fill();}}
}
drawStreetProps(t,p);
}
if(!road&&t.building){
 const z=cam.zoom;
 if(['home','oldhome','apartments'].includes(t.building.kind)){ctx.strokeStyle='#7d866f88';ctx.lineWidth=1*z;ctx.beginPath();ctx.moveTo(p.x-24*z,p.y);ctx.lineTo(p.x,p.y+12*z);ctx.lineTo(p.x+24*z,p.y);ctx.stroke();}
 drawBuilding(t,time);drawFrontage(t,p);
}
if(!road&&t.space)drawPublicSpace(t,p);
if(!road&&!t.building&&!t.space){
const z=cam.zoom;
if((t.x*3+t.y*5)%4===0){drawTree(p.x+12*z,p.y-7*z,.55*z);}
if((t.x*7+t.y*2)%5===0){
ctx.fillStyle='#e5d5a7';ctx.beginPath();ctx.ellipse(p.x-12*z,p.y+2*z,5*z,2*z,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#f4c66d';ctx.beginPath();ctx.arc(p.x-12*z,p.y-3*z,2.5*z,0,Math.PI*2);ctx.fill();
}
}
if(t===selected){let w=T*.72*cam.zoom,h=T*.36*cam.zoom;poly([{x:p.x,y:p.y-h},{x:p.x+w,y:p.y},{x:p.x,y:p.y+h},{x:p.x-w,y:p.y}], '#d5ef7a33','#f3ff9a');}
}
drawCityLife(time);
requestAnimationFrame(draw);
}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2100);}
function save(){localStorage.setItem(SAVE,JSON.stringify({...state,worldSize:N,owned:state.owned?state.owned.id:null,cam:{x:cam.x,y:cam.y,zoom:cam.zoom}}));}
function hasSave(){return !!localStorage.getItem(SAVE);}
function load(){let raw=localStorage.getItem(SAVE);if(!raw)return false;try{let s=JSON.parse(raw);Object.assign(state,s);let oldOwned=s.owned;if(s.worldSize===11&&Number.isInteger(oldOwned)){let ox=oldOwned%11,oy=Math.floor(oldOwned/11);oldOwned=oy*N+ox;}state.owned=oldOwned===null?null:tiles.find(t=>t.id===oldOwned)||null;if(state.owned)state.owned.building={name:state.company,emoji:'🍕',color:'#c96f43',kind:'pizza'};if(s.cam){cam.x=s.worldSize===11?N/2:(s.cam.x??N/2);cam.y=s.worldSize===11?N/2:(s.cam.y??N/2);cam.zoom=Math.max(.9,Math.min(1.8,s.cam.zoom||1.12));}clampCamera();refreshMoney();return true;}catch(e){return false;}}
function refreshMoney(){$('money').textContent=Math.round(state.money).toLocaleString('de-DE')+' €';}
function show(id){document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'));$(id).classList.add('show');}
function enterWorld(){document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'));$('hint').textContent='Wische, um die Stadt zu erkunden · Grundstück antippen';save();draw();}
function introRoute(){if(hasSave()&&load()){enterWorld();toast('Willkommen zurück, '+state.company+'!');}else show('mainMenu');}
$('introGo').onclick=introRoute;
$('newGame').onclick=()=>show('setup');
$('cancelSetup').onclick=()=>show('mainMenu');
$('createCompany').onclick=()=>{state.company=$('company').value.trim()||'Tonys Pizza';state.money=Number($('capital').value);state.day=1;state.started=true;state.owned=null;state.shop=null;state.customers=0;state.revenue=0;cam={x:N/2,y:N/2,zoom:1.12,ready:true};save();enterWorld();toast('Willkommen! Suche ein freies Gewerbegrundstück oder Ladenlokal.');};
$('loadGame').onclick=()=>{if(load()){enterWorld();toast('Spielstand geladen.');}else toast('Noch kein Spielstand vorhanden.');};
$('settings').onclick=()=>toast('Einstellungen kommen im nächsten Ausbau.');
function hit(sx,sy){let best=null,dist=1e9;for(let t of tiles){if(t.road)continue;let p=screen(t.x,t.y),d=Math.hypot((sx-p.x)/.9,(sy-p.y)/.55);if(d<dist){dist=d;best=t;}}return dist<55*cam.zoom?best:null;}
function openPanel(title,body,actions=''){$('panel').innerHTML='<div class="panelhead"><h2>'+title+'</h2><button class="close" id="closePanel">✕</button></div>'+body+actions;$('panel').style.display='block';$('closePanel').onclick=()=>$('panel').style.display='none';}
function isPizzaLocation(t){if(!t||!t.plot||t.space)return false;if(!t.building)return true;return ['shop','cafe','market'].includes(t.building.kind);}
function selectTile(t){selected=t;if(!t){$('panel').style.display='none';return;}if(t===state.owned){showBusiness();return;}let b=t.building,available=isPizzaLocation(t);let placeName=!b?'Freie Gewerbefläche':b.name;let body='<p class="muted">'+placeName+' · '+(t.traffic>70?'Hohe':'Mittlere')+' Laufkundschaft</p><div class="statrow"><span>Passantenaufkommen</span><b>'+t.traffic+'/100</b></div>';
if(available){
 body+='<div class="statrow"><span>Gewerbemiete pro Tag</span><b>'+t.rent+' €</b></div><p class="muted">'+(!b?'Freie Fläche – hier kann ein neues Lokal entstehen.':'Geeignetes Ladenlokal – du kannst hier deine Pizzeria eröffnen.')+'</p>';
}else{
 body+='<p class="muted">Dieses Gebäude ist kein freies Ladenlokal. Wohnhäuser, Hochhäuser, Schulen und öffentliche Gebäude sind Teil der Stadt und können nicht übernommen werden.</p>';
}
let acts=available?'<div class="actions"><button id="rent">Gewerbefläche mieten</button></div>':'';
openPanel(available?'Standort prüfen':'Stadtgebäude',body,acts);
if(available)$('rent').onclick=()=>claim(t,'rent');}
function claim(t,mode){if(state.owned){toast('Du hast bereits eine Pizzeria.');return;}if(!isPizzaLocation(t)){toast('Hier gibt es kein verfügbares Ladenlokal.');return;}let cost=t.rent*5;if(state.money<cost){toast('Dafür reicht dein Kapital nicht.');return;}state.money-=cost;state.owned=t;t.building={name:state.company,emoji:'🍕',color:'#c96f43',kind:'pizza'};state.shop={rent:true,price:12,quality:2,staff:1,stock:50,level:1};refreshMoney();save();showBusiness();toast('Deine Pizzeria ist eröffnet!');}
function showBusiness(){if(!state.owned){openPanel('Deine Pizzeria','<p class="muted">Du hast noch kein Lokal. Suche dir in der Stadt ein Grundstück aus.</p>');return;}let s=state.shop;let body='<p class="muted">'+state.company+' · '+(s.rent?'Gemietet':'Eigentum')+'</p><div class="statrow"><span>Preis pro Pizza</span><b>'+s.price+' €</b></div><div class="statrow"><span>Qualität</span><b>'+s.quality+'/5</b></div><div class="statrow"><span>Mitarbeiter</span><b>'+s.staff+'</b></div><div class="statrow"><span>Zutaten auf Lager</span><b>'+s.stock+'</b></div><div class="statrow"><span>Tag</span><b>'+state.day+'</b></div>';
let acts='<div class="actions"><button id="priceDown" class="secondary">Preis −</button><button id="priceUp">Preis +</button></div><div class="actions"><button id="quality" class="secondary">Qualität verbessern · 350 €</button><button id="staff">Personal einstellen · 500 €</button></div><div class="actions"><button id="day">Nächsten Tag spielen →</button></div>';
openPanel('🍕 '+state.company,body,acts);
$('priceDown').onclick=()=>{s.price=Math.max(5,s.price-1);showBusiness();save();};$('priceUp').onclick=()=>{s.price=Math.min(30,s.price+1);showBusiness();save();};
$('quality').onclick=()=>{if(state.money<350||s.quality>=5){toast('Nicht möglich.');return;}state.money-=350;s.quality++;refreshMoney();showBusiness();save();};
$('staff').onclick=()=>{if(state.money<500){toast('Nicht genug Geld.');return;}state.money-=500;s.staff++;refreshMoney();showBusiness();save();};
$('day').onclick=nextDay;}
function nextDay(){let s=state.shop;if(!s){toast('Erst eine Pizzeria eröffnen.');return;}let customers=Math.max(8,Math.round((state.owned.traffic*.55+s.quality*5+s.staff*7)*(1-Math.abs(s.price-12)*.035)));let sold=Math.min(s.stock,customers);let revenue=sold*s.price,cost=sold*4+s.staff*55+(s.rent?state.owned.rent:0);let profit=revenue-cost;state.money+=profit;s.stock=Math.max(0,s.stock-sold);state.customers+=sold;state.revenue+=revenue;state.day++;refreshMoney();save();openPanel('📊 Tagesabschluss','<p class="muted">Tag '+(state.day-1)+' · '+state.company+'</p><div class="statrow"><span>Bediente Kunden</span><b>'+sold+'</b></div><div class="statrow"><span>Umsatz</span><b>'+revenue.toLocaleString('de-DE')+' €</b></div><div class="statrow"><span>Kosten</span><b>'+cost.toLocaleString('de-DE')+' €</b></div><div class="statrow"><span>Tagesergebnis</span><b style="color:'+(profit>=0?'#b6e36b':'#ff8b7d')+'">'+(profit>=0?'+':'')+profit.toLocaleString('de-DE')+' €</b></div><p class="muted">Der Lagerbestand muss später wieder aufgefüllt werden.</p>','<div class="actions"><button id="okDay">Weiter</button></div>');$('okDay').onclick=()=>showBusiness();}
function tab(name){activeTab=name;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name==='city'){$('panel').style.display='none';$('hint').textContent='Wische, um die Stadt zu erkunden · Grundstück antippen';}if(name==='business')showBusiness();if(name==='map'){openPanel('🗺️ Stadtkarte','<p class="muted">Deine Stadt: 61 × 61 Felder. Wische frei über die Stadt. Mit zwei Fingern zoomst du.</p><div class="statrow"><span>Dein Standort</span><b>'+(state.owned?'Eröffnet':'Noch keiner')+'</b></div>');}if(name==='menu'){openPanel('☰ Spielmenü','<p class="muted">Dein Fortschritt wird automatisch gespeichert.</p><div class="statrow"><span>Spieltag</span><b>'+state.day+'</b></div><div class="statrow"><span>Gesamtumsatz</span><b>'+state.revenue.toLocaleString('de-DE')+' €</b></div><div class="actions"><button id="saveNow">Speichern</button><button class="secondary" id="pauseMenu">Hauptmenü</button></div>');$('saveNow').onclick=()=>{save();toast('Spiel gespeichert.');};$('pauseMenu').onclick=()=>{save();show('mainMenu');};}}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));
function pointerDown(e){e.preventDefault();if(e.pointerType==='touch'&&e.isPrimary===false)return;canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};}
function pointerMove(e){if(!drag||drag.id!==e.pointerId)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;if(drag.moved){const sx=dx/(T*.72*cam.zoom),sy=dy/(T*.36*cam.zoom),wx=(sx+sy)*.5,wy=(sy-sx)*.5;cam.x-=wx;cam.y-=wy;clampCamera();drag.x=e.clientX;drag.y=e.clientY;}}
function pointerUp(e){if(!drag||drag.id!==e.pointerId)return;if(!drag.moved){let t=hit(e.clientX,e.clientY);if(t)selectTile(t);}drag=null;save();}
canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',()=>drag=null);
let lastPinch=0;canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){drag=null;pinch={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),z:cam.zoom};}},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){e.preventDefault();let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);cam.zoom=Math.max(.9,Math.min(1.8,pinch.z*d/pinch.d));clampCamera();}},{passive:false});
canvas.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.started)save();});
window.addEventListener('pagehide',()=>{if(state.started)save();});
resize();refreshMoney();
})();
</script>
</body></html>
