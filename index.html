<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101914">
<title>Pizza Tycoon</title>
<style>
:root{--ink:#f5f1e8;--muted:#b8c1b7;--panel:#18251f;--panel2:#24352c;--lime:#b6e36b;--gold:#f4c56a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101914;color:var(--ink);font-family:system-ui,-apple-system,sans-serif;touch-action:none}button,input{font:inherit}button{border:0;border-radius:14px;padding:13px 16px;font-weight:800;color:#172016;background:var(--lime);cursor:pointer}button.secondary{background:#34463b;color:var(--ink);border:1px solid #526557}button:disabled{opacity:.4}
#game{position:fixed;inset:0;background:linear-gradient(#8eb5a0,#d4c9a0)}canvas{width:100%;height:100%;display:block;touch-action:none}
#top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;background:linear-gradient(#101914c9,transparent)}
.brand{font-weight:1000;letter-spacing:1.4px;text-shadow:0 2px 5px #0008}.brand span{color:var(--lime)}.money{background:#17241ddd;border:1px solid #ffffff30;border-radius:99px;padding:8px 12px;color:var(--gold);font-weight:900}
#hint{position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);background:#17241ddd;padding:7px 12px;border-radius:99px;font-size:12px;color:#e6eee4;white-space:nowrap;pointer-events:none}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:9px 8px calc(env(safe-area-inset-bottom) + 8px);display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:linear-gradient(transparent,#101914 24%)}
.nav{background:#1b2a22ed;color:#dce6d8;border:1px solid #ffffff20;padding:9px 3px;font-size:11px;border-radius:13px}.nav b{display:block;font-size:20px;margin-bottom:2px}.nav.active{background:#344b36;color:var(--lime);border-color:#a8d86a}
#panel{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 78px);max-height:42vh;overflow:auto;background:#17251fee;border:1px solid #ffffff2b;border-radius:20px;padding:15px;box-shadow:0 14px 45px #0008;display:none;backdrop-filter:blur(12px)}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.panelhead h2{font-size:18px;margin:0}.close{background:#34463b;color:white;padding:7px 11px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.statrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff17;font-size:14px}
.overlay{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:22px;background:linear-gradient(145deg,#101914f5,#26382bf2)}.overlay.show{display:flex}.modal{width:min(440px,100%);background:#18271f;border:1px solid #ffffff2b;border-radius:25px;padding:24px;box-shadow:0 25px 80px #0009}.logo{font-size:56px;text-align:center;filter:drop-shadow(0 8px 12px #0008)}h1{font-size:30px;line-height:1.05;text-align:center;margin:8px 0}.sub{text-align:center;color:#bdc9bc;margin:0 0 22px}.menuBtns{display:grid;gap:10px}.field{display:block;margin:12px 0;color:#d9e3d6;font-size:13px}.field input{width:100%;padding:13px;border:1px solid #526557;border-radius:12px;background:#101914;color:white;margin-top:6px}.menuBtns button{width:100%}.tiny{text-align:center;font-size:11px;color:#93a295;margin-top:17px}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 94px);transform:translateX(-50%);background:#17251f;color:white;border:1px solid #ffffff30;border-radius:12px;padding:10px 14px;display:none;white-space:nowrap;z-index:4}
</style>
</head>
<body>
<div id="game"><canvas id="world"></canvas>
<div id="top"><div class="brand">🍕 PIZZA <span>TYCOON</span></div><div class="money" id="money">5.000 €</div></div>
<div id="hint">Stadt bewegen · Grundstück antippen</div>
<div id="toast"></div>
<div id="panel"></div>
<div id="bottom">
<button class="nav active" data-tab="city"><b>🏙️</b>Stadt</button>
<button class="nav" data-tab="business"><b>🍕</b>Pizzeria</button>
<button class="nav" data-tab="map"><b>🗺️</b>Karte</button>
<button class="nav" data-tab="menu"><b>☰</b>Menü</button>
</div></div>
<div class="overlay show" id="intro"><div class="modal"><div class="logo">🍕</div><h1>PIZZA TYCOON</h1><p class="sub">Deine Stadt. Dein Geschäft. Deine Regeln.</p><div class="menuBtns"><button id="introGo">Spiel betreten</button></div><div class="tiny">Eine Stadt wartet auf dich.</div></div></div>
<div class="overlay" id="mainMenu"><div class="modal"><div class="logo">🍕</div><h1>PIZZA TYCOON</h1><p class="sub">Baue dein Pizza-Imperium.</p><div class="menuBtns"><button id="newGame">Neues Spiel</button><button class="secondary" id="loadGame">Spiel laden</button><button class="secondary" id="settings">Einstellungen</button></div><div class="tiny">Mobile Edition · Entwicklungs-Version</div></div></div>
<div class="overlay" id="setup"><div class="modal"><div class="logo">🏪</div><h1>Dein Unternehmen</h1><p class="sub">Wie soll deine erste Pizzeria heißen?</p><label class="field">Firmenname<input id="company" maxlength="24" placeholder="z. B. Tonys Pizza"></label><label class="field">Startkapital<select id="capital" class="field" style="width:100%;padding:12px;background:#101914;color:white;border:1px solid #526557;border-radius:12px"><option value="5000">Normal · 5.000 €</option><option value="3000">Schwer · 3.000 €</option><option value="8000">Entspannt · 8.000 €</option></select></label><div class="menuBtns"><button id="createCompany">Stadt betreten</button><button class="secondary" id="cancelSetup">Zurück</button></div></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
const SAVE='pizzaTycoonWorld_v2';
let W=0,H=0,dpr=1,cam={x:0,y:0,zoom:1},drag=null,pinch=null,selected=null,activeTab='city',last=0,toastTimer=0;
const state={company:'',money:5000,day:1,owned:null,shop:null,customers:0,revenue:0,started:false};
const N=11,T=64,tiles=[];
const buildings=[
 {name:'Wohnhaus',emoji:'🏠',color:'#c77d58',kind:'home'},
 {name:'Bürogebäude',emoji:'🏢',color:'#8da4ad',kind:'office'},
 {name:'Schule',emoji:'🏫',color:'#d8b76c',kind:'school'},
 {name:'Supermarkt',emoji:'🏬',color:'#9eaa75',kind:'market'},
 {name:'Park',emoji:'🌳',color:'#4e895c',kind:'park'},
 {name:'Ladenlokal',emoji:'🏪',color:'#b77d9b',kind:'shop'}
];
function makeCity(){for(let y=0;y<N;y++)for(let x=0;x<N;x++){let road=(x%3===0||y%3===0);let edge=x===0||y===0||x===N-1||y===N-1;let type=(x*7+y*11)%6;let plot=!road&&!edge;tiles.push({x,y,road,plot,building:plot?(type===5?null:buildings[type]):null,price:900+((x*73+y*91)%8)*180,traffic:35+((x*19+y*13)%60),rent:120+((x*31+y*17)%100),id:y*N+x});}}
makeCity();
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!cam.ready){cam.x=W/2;cam.y=H*.46;cam.ready=true;}draw();}
addEventListener('resize',resize);
function iso(x,y){return{x:(x-y)*T*.72,y:(x+y)*T*.36};}
function screen(x,y){let p=iso(x,y);return{x:cam.x+p.x*cam.zoom,y:cam.y+p.y*cam.zoom};}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
function diamond(x,y,color){let p=screen(x,y),w=T*.72*cam.zoom,h=T*.36*cam.zoom;poly([{x:p.x,y:p.y-h},{x:p.x+w,y:p.y},{x:p.x,y:p.y+h},{x:p.x-w,y:p.y}],color,'#344c3e55');}
function drawBuilding(tile,time){let p=screen(tile.x,tile.y),z=cam.zoom,b=tile.building;if(!b)return;
if(tile===state.owned){b={name:state.company,emoji:'🍕',color:'#c96f43',kind:'pizza'};}
let height=(b.kind==='office'?68:b.kind==='school'?45:b.kind==='pizza'?49:35)*z;
let width=34*z,depth=25*z,baseY=p.y-5*z;
poly([{x:p.x-width,y:baseY},{x:p.x,y:baseY+depth*.48},{x:p.x+width,y:baseY},{x:p.x,y:baseY-depth*.48}],b.color);
poly([{x:p.x-width,y:baseY},{x:p.x,y:baseY-depth*.48},{x:p.x,y:baseY-height-depth*.48},{x:p.x-width,y:baseY-height}],shade(b.color,-22));
poly([{x:p.x,y:baseY-depth*.48},{x:p.x+width,y:baseY},{x:p.x+width,y:baseY-height},{x:p.x,y:baseY-height-depth*.48}],shade(b.color,12));
poly([{x:p.x-width,y:baseY-height},{x:p.x,y:baseY-height-depth*.48},{x:p.x+width,y:baseY-height},{x:p.x,y:baseY-height+depth*.48}],shade(b.color,28));
if(z>.68){ctx.font=(b.kind==='pizza'?20:17)*z+'px serif';ctx.textAlign='center';ctx.fillText(b.emoji,p.x,p.y-height*.55);}
if(b.kind==='pizza'){ctx.fillStyle='#fff1c7';ctx.fillRect(p.x-7*z,baseY-height*.28,14*z,10*z);ctx.fillStyle='#a8472d';ctx.fillRect(p.x-5*z,baseY-height*.25,10*z,7*z);}
}
function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return'#'+(1<<24|r<<16|g<<8|b).toString(16).slice(1);}
function draw(time=0){if(!W)return;ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8fb9a4');sky.addColorStop(1,'#d5c99f');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#668d68';ctx.fillRect(0,H*.68,W,H*.32);
const ordered=[...tiles].sort((a,b)=>a.x+a.y-(b.x+b.y));
for(const t of ordered){let p=screen(t.x,t.y);if(p.x<-100||p.x>W+100||p.y<-130||p.y>H+100)continue;
let road=t.road;diamond(t.x,t.y,road?'#59635d':(t.plot?'#82a875':'#71986e'));
if(road&&t.x%3===0&&t.y%3===0){ctx.strokeStyle='#e6dfbd88';ctx.lineWidth=2*cam.zoom;ctx.beginPath();ctx.moveTo(p.x-7*cam.zoom,p.y);ctx.lineTo(p.x+7*cam.zoom,p.y);ctx.stroke();}
if(!road&&t.building)drawBuilding(t,time);
if(t===selected){let w=T*.72*cam.zoom,h=T*.36*cam.zoom;poly([{x:p.x,y:p.y-h},{x:p.x+w,y:p.y},{x:p.x,y:p.y+h},{x:p.x-w,y:p.y}], '#d5ef7a33','#f3ff9a');}
}
for(let i=0;i<8;i++){let x=(i*173+time*.012)%(W+100)-50,y=H*.28+(i%4)*48;ctx.fillStyle='#fff8';ctx.beginPath();ctx.ellipse(x,y,20,5,0,0,Math.PI*2);ctx.fill();}
requestAnimationFrame(draw);
}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2100);}
function save(){localStorage.setItem(SAVE,JSON.stringify({...state,owned:state.owned?state.owned.id:null,cam:{x:cam.x/W,y:cam.y/H,zoom:cam.zoom}}));}
function hasSave(){return !!localStorage.getItem(SAVE);}
function load(){let raw=localStorage.getItem(SAVE);if(!raw)return false;try{let s=JSON.parse(raw);Object.assign(state,s);state.owned=s.owned===null?null:tiles.find(t=>t.id===s.owned)||null;if(s.cam){cam.x=s.cam.x*W;cam.y=s.cam.y*H;cam.zoom=s.cam.zoom||1;}refreshMoney();return true;}catch(e){return false;}}
function refreshMoney(){$('money').textContent=Math.round(state.money).toLocaleString('de-DE')+' €';}
function show(id){document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'));$(id).classList.add('show');}
function enterWorld(){document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'));$('hint').textContent='Wischen zum Bewegen · Grundstück antippen';save();draw();}
function introRoute(){if(hasSave()&&load()){enterWorld();toast('Willkommen zurück, '+state.company+'!');}else show('mainMenu');}
$('introGo').onclick=introRoute;
$('newGame').onclick=()=>show('setup');
$('cancelSetup').onclick=()=>show('mainMenu');
$('createCompany').onclick=()=>{state.company=$('company').value.trim()||'Tonys Pizza';state.money=Number($('capital').value);state.day=1;state.started=true;state.owned=null;state.shop=null;state.customers=0;state.revenue=0;cam={x:W/2,y:H*.46,zoom:1,ready:true};save();enterWorld();toast('Willkommen in deiner Stadt! Tippe ein freies Grundstück an.');};
$('loadGame').onclick=()=>{if(load()){enterWorld();toast('Spielstand geladen.');}else toast('Noch kein Spielstand vorhanden.');};
$('settings').onclick=()=>toast('Einstellungen kommen im nächsten Ausbau.');
function hit(sx,sy){let best=null,dist=1e9;for(let t of tiles){if(t.road)continue;let p=screen(t.x,t.y),d=Math.hypot((sx-p.x)/.9,(sy-p.y)/.55);if(d<dist){dist=d;best=t;}}return dist<55*cam.zoom?best:null;}
function openPanel(title,body,actions=''){$('panel').innerHTML='<div class="panelhead"><h2>'+title+'</h2><button class="close" id="closePanel">✕</button></div>'+body+actions;$('panel').style.display='block';$('closePanel').onclick=()=>$('panel').style.display='none';}
function selectTile(t){selected=t;if(!t){$('panel').style.display='none';return;}if(t===state.owned){showBusiness();return;}let b=t.building;let body='<p class="muted">'+(b?b.name:'Freies Grundstück')+' · '+(t.traffic>70?'Hohe':'Mittlere')+' Laufkundschaft</p><div class="statrow"><span>Passantenaufkommen</span><b>'+t.traffic+'/100</b></div><div class="statrow"><span>Miete pro Tag</span><b>'+t.rent+' €</b></div><div class="statrow"><span>Kaufpreis</span><b>'+t.price.toLocaleString('de-DE')+' €</b></div>';
let acts='<div class="actions"><button id="rent">Mieten</button><button class="secondary" id="buy">Kaufen</button></div>';
openPanel('Grundstück entdecken',body,acts);
$('rent').onclick=()=>claim(t,'rent');$('buy').onclick=()=>claim(t,'buy');}
function claim(t,mode){if(state.owned){toast('Du hast bereits eine Pizzeria.');return;}let cost=mode==='rent'?t.rent*5:t.price;if(state.money<cost){toast('Dafür reicht dein Kapital nicht.');return;}state.money-=cost;state.owned=t;t.building={name:state.company,emoji:'🍕',color:'#c96f43',kind:'pizza'};state.shop={rent:mode==='rent',price:12,quality:2,staff:1,stock:50,level:1};refreshMoney();save();showBusiness();toast('Deine Pizzeria ist eröffnet!');}
function showBusiness(){if(!state.owned){openPanel('Deine Pizzeria','<p class="muted">Du hast noch kein Lokal. Suche dir in der Stadt ein Grundstück aus.</p>');return;}let s=state.shop;let body='<p class="muted">'+state.company+' · '+(s.rent?'Gemietet':'Eigentum')+'</p><div class="statrow"><span>Preis pro Pizza</span><b>'+s.price+' €</b></div><div class="statrow"><span>Qualität</span><b>'+s.quality+'/5</b></div><div class="statrow"><span>Mitarbeiter</span><b>'+s.staff+'</b></div><div class="statrow"><span>Zutaten auf Lager</span><b>'+s.stock+'</b></div><div class="statrow"><span>Tag</span><b>'+state.day+'</b></div>';
let acts='<div class="actions"><button id="priceDown" class="secondary">Preis −</button><button id="priceUp">Preis +</button></div><div class="actions"><button id="quality" class="secondary">Qualität verbessern · 350 €</button><button id="staff">Personal einstellen · 500 €</button></div><div class="actions"><button id="day">Nächsten Tag spielen →</button></div>';
openPanel('🍕 '+state.company,body,acts);
$('priceDown').onclick=()=>{s.price=Math.max(5,s.price-1);showBusiness();save();};$('priceUp').onclick=()=>{s.price=Math.min(30,s.price+1);showBusiness();save();};
$('quality').onclick=()=>{if(state.money<350||s.quality>=5){toast('Nicht möglich.');return;}state.money-=350;s.quality++;refreshMoney();showBusiness();save();};
$('staff').onclick=()=>{if(state.money<500){toast('Nicht genug Geld.');return;}state.money-=500;s.staff++;refreshMoney();showBusiness();save();};
$('day').onclick=nextDay;}
function nextDay(){let s=state.shop;if(!s){toast('Erst eine Pizzeria eröffnen.');return;}let customers=Math.max(8,Math.round((state.owned.traffic*.55+s.quality*5+s.staff*7)*(1-Math.abs(s.price-12)*.035)));let sold=Math.min(s.stock,customers);let revenue=sold*s.price,cost=sold*4+s.staff*55+(s.rent?state.owned.rent:0);let profit=revenue-cost;state.money+=profit;s.stock=Math.max(0,s.stock-sold);state.customers+=sold;state.revenue+=revenue;state.day++;refreshMoney();save();openPanel('📊 Tagesabschluss','<p class="muted">Tag '+(state.day-1)+' · '+state.company+'</p><div class="statrow"><span>Bediente Kunden</span><b>'+sold+'</b></div><div class="statrow"><span>Umsatz</span><b>'+revenue.toLocaleString('de-DE')+' €</b></div><div class="statrow"><span>Kosten</span><b>'+cost.toLocaleString('de-DE')+' €</b></div><div class="statrow"><span>Tagesergebnis</span><b style="color:'+(profit>=0?'#b6e36b':'#ff8b7d')+'">'+(profit>=0?'+':'')+profit.toLocaleString('de-DE')+' €</b></div><p class="muted">Der Lagerbestand muss später wieder aufgefüllt werden.</p>','<div class="actions"><button id="okDay">Weiter</button></div>');$('okDay').onclick=()=>showBusiness();}
function tab(name){activeTab=name;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name==='city'){$('panel').style.display='none';$('hint').textContent='Wischen zum Bewegen · Grundstück antippen';}if(name==='business')showBusiness();if(name==='map'){openPanel('🗺️ Stadtkarte','<p class="muted">Dein Viertel: 11 × 11 Felder. Ziehe die Stadt mit einem Finger und zoome mit zwei Fingern.</p><div class="statrow"><span>Dein Standort</span><b>'+(state.owned?'Eröffnet':'Noch keiner')+'</b></div>');}if(name==='menu'){openPanel('☰ Spielmenü','<p class="muted">Dein Fortschritt wird automatisch gespeichert.</p><div class="statrow"><span>Spieltag</span><b>'+state.day+'</b></div><div class="statrow"><span>Gesamtumsatz</span><b>'+state.revenue.toLocaleString('de-DE')+' €</b></div><div class="actions"><button id="saveNow">Speichern</button><button class="secondary" id="pauseMenu">Hauptmenü</button></div>');$('saveNow').onclick=()=>{save();toast('Spiel gespeichert.');};$('pauseMenu').onclick=()=>{save();show('mainMenu');};}}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));
function pointerDown(e){e.preventDefault();canvas.setPointerCapture(e.pointerId);if(e.pointerType==='touch'&&e.isPrimary===false){return;}drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false,id:e.pointerId};}
function pointerMove(e){if(!drag||drag.id!==e.pointerId)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;if(drag.moved){cam.x=drag.cx+dx;cam.y=drag.cy+dy;}}
function pointerUp(e){if(!drag||drag.id!==e.pointerId)return;if(!drag.moved){let t=hit(e.clientX,e.clientY);if(t)selectTile(t);}drag=null;}
canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',()=>drag=null);
let lastPinch=0;canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){drag=null;pinch={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),z:cam.zoom};}},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){e.preventDefault();let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);cam.zoom=Math.max(.55,Math.min(1.8,pinch.z*d/pinch.d));}},{passive:false});
canvas.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.started)save();});
window.addEventListener('pagehide',()=>{if(state.started)save();});
resize();refreshMoney();
})();
</script>
</body></html>
